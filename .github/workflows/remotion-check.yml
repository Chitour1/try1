name: Remotion setup and render check

on:
  push:
    paths:
      - "remotion-studio/**"
      - ".claude/skills/remotion-video/**"
      - ".github/workflows/remotion-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remotion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Render sample MP4
        run: npx remotion render src/index.ts ArabicIntro out/check.mp4 --frames=0-29 --concurrency=1 --log=error
      - name: Save sample video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-check-mp4
          path: remotion-studio/out/check.mp4
          if-no-files-found: error
