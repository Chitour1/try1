<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:'Bahij';font-weight:400;src:url('fonts/Bahij-Plain.ttf');}
@font-face{font-family:'Bahij';font-weight:700;src:url('fonts/Bahij-Bold.ttf');}
@font-face{font-family:'Bahij';font-weight:900;src:url('fonts/Bahij-Black.ttf');}
:root{--ink:#0F1B2A;--paper:#F2F4F6;--seal:#D4A21B;--cat:#C8102E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:'Bahij'}
#st{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
#bgb{position:absolute;left:-300px;top:-200px;width:1680px;height:2320px;object-fit:cover;filter:blur(46px) brightness(.32) saturate(1.1)}
#pw{position:absolute;left:0;top:300px;width:1080px;height:720px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#ph{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,14,22,.55),transparent 40%)}
#cr{position:absolute;left:24px;bottom:16px;color:rgba(255,255,255,.8);font-weight:700;font-size:22px;text-shadow:0 1px 4px #000}
#top{position:absolute;top:196px;right:48px;display:flex;align-items:center;gap:22px;direction:rtl}
#top .tag{background:var(--cat);color:#fff;font-weight:900;font-size:46px;padding:2px 30px 9px}
#top .dt{color:rgba(242,244,246,.85);font-weight:700;font-size:28px;text-shadow:0 2px 8px #000}
#mk{position:absolute;top:184px;left:40px;width:100px}
#hl{position:absolute;right:132px;left:40px;top:1080px;direction:rtl}
#hl .box{background:#fff;border-right:22px solid var(--cat);padding:20px 36px 26px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#hl .l{display:flex;flex-wrap:wrap;gap:0 16px;color:var(--ink);font-weight:900;font-size:66px;line-height:1.35}
#hl .w{display:inline-block}#hl .w.k{color:var(--cat)}
#chip{display:inline-flex;align-items:center;gap:12px;margin-top:18px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:26px;padding:8px 26px 11px}
#chip i{width:13px;height:13px;border-radius:50%;background:var(--seal);display:block}
#tick{position:absolute;left:0;right:0;top:1610px;height:92px;background:#0a121c;display:flex;direction:rtl;overflow:hidden}
#tick .lab{position:relative;z-index:2;background:var(--cat);color:#fff;font-weight:900;font-size:40px;padding:16px 36px;white-space:nowrap}
#tick .run{position:absolute;top:22px;white-space:nowrap;color:#fff;font-weight:700;font-size:40px;direction:rtl}
#tick .run b{color:var(--seal);margin:0 22px}
#bar{position:absolute;left:0;right:0;top:1610px;height:92px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 48px;direction:rtl}
#bar .nm{display:flex;align-items:center;gap:16px;color:var(--paper);font-weight:900;font-size:36px}
#bar .nm img{height:56px}
#bar .sl{color:rgba(242,244,246,.7);font-weight:700;font-size:26px}
#frame{position:absolute;inset:0;pointer-events:none}
/* sting */
#sting{position:absolute;inset:0;background:var(--ink);overflow:hidden}
#sting .m{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-330px 0 0 -180px}
#sting .band{position:absolute;left:0;right:0;top:1100px;height:170px;background:var(--cat);display:flex;align-items:center;justify-content:center}
#sting .band b{color:#fff;font-weight:900;font-size:110px;line-height:1}
#sting .nmw{position:absolute;left:0;right:0;top:575px;text-align:center;color:var(--paper);font-weight:900;font-size:56px}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.05;object-fit:cover}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div id="st">
 <img id="bgb" src="hd.jpg"><div id="pw"><img id="ph" src="hd.jpg"><div id="shade"></div><div id="cr"></div></div>
 <div id="top"><div class="tag"></div><div class="dt"></div></div>
 <img id="mk" src="mark.png">
 <div id="hl"><div class="box"><div class="l" id="l1"></div></div><div id="chip"><i></i><span></span></div></div>
 <div id="tick"><div class="lab"></div><div class="run" id="run"></div></div>
 <div id="bar"><div class="nm"><img src="mark-ink.png">موثّق</div><div class="sl">الخبر بمصدره</div></div>
 <canvas id="frame" width="1080" height="1920"></canvas>
 <div id="sting"><img class="m" src="mark-ink.png"><div class="band"><b></b></div></div>
 <img id="grain"><div id="flash"></div>
</div>
<script>
const CFG=window.CFG;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,p)=>a+(b-a)*p,P=(t,a,b)=>cl((t-a)/(b-a));
const eOut=p=>1-Math.pow(1-p,3),eIO3=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,eback=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const nz=x=>Math.sin(x*1.7)*.5+Math.sin(x*3.13+1.3)*.3+Math.sin(x*7.7+.4)*.2;
const W0=1.25,WD=.17;let ws=[];
window.__setup=async()=>{
 document.documentElement.style.setProperty('--cat',CFG.color);
 await document.fonts.load('900 80px Bahij');await document.fonts.load('700 80px Bahij');
 $('top').querySelector('.tag').textContent=CFG.label;$('top').querySelector('.dt').textContent=CFG.date;
 $('cr').textContent=CFG.credit;$('chip').querySelector('span').textContent=CFG.source;
 $('sting').querySelector('b').textContent=CFG.label;$('tick').querySelector('.lab').textContent=CFG.label;
 CFG.words.forEach((w,i)=>{const s=document.createElement('span');s.className='w'+(CFG.key.includes(i)?' k':'');s.textContent=w;$('l1').appendChild(s);ws.push(s)});
 if(CFG.breaking){$('run').innerHTML=(CFG.ticker.map(x=>x+'<b>●</b>').join('')).repeat(4);$('bar').style.display='none'}else{$('tick').style.display='none'}
 await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));};
window.__renderAt=async t=>{
 const T=CFG.dur;
 // ---- 1-second sting: seal stamps, category band, wipe out to the left
 const sm=P(t,.06,.24);const m=$('sting').querySelector('.m');
 m.style.transform=`scale(${t<.06?1.6:1.6-.6*eback(sm)}) rotate(${(1-eOut(sm))*-8}deg)`;m.style.opacity=t<.06?0:1;
 const bd=eOut(P(t,.42,.62));const band=$('sting').querySelector('.band');band.style.clipPath=`inset(0 0 0 ${(1-bd)*100}%)`;
 const bb=P(t,.5,.64);band.querySelector('b').style.transform=`scale(${bb<1?1.5-.5*eback(bb):1})`;band.querySelector('b').style.opacity=bb>0?1:0;
 const wo=eIO3(P(t,.82,1.02));$('sting').style.transform=`translateX(${-wo*1200}px)`;$('sting').style.display=wo>=1&&t<T-.7?'none':'block';
 // end card: sting panel returns from the right with the seal only
 if(t>=T-.7){const e=eIO3(P(t,T-.7,T-.45));$('sting').style.display='block';$('sting').style.transform=`translateX(${(1-e)*1200}px)`;band.style.clipPath='inset(0 0 0 100%)';m.style.transform='scale(1)';m.style.opacity=1}
 // ---- photo
 const dv=CFG.breaking&&CFG.focus?eIO3(P(t,T-3.7,T-2.4)):0;
 let z=.667*(1+.06*P(t,1,T)),cx=1000,cy=540;
 z=lerp(z,1.25,dv);cx=lerp(cx,(CFG.focus||[960,540])[0],dv);cy=lerp(cy,(CFG.focus||[960,540])[1],dv);
 let x=540-cx*z,y=360-cy*z;x=Math.min(0,Math.max(1080-1920*z,x));y=Math.min(0,Math.max(720-1080*z,y));
 $('ph').style.transform=`translate(${x}px,${y}px) scale(${z})`;
 // ---- tag, date, mark
 const tq=eOut(P(t,1.05,1.3));$('top').style.opacity=tq;$('top').style.transform=`translateX(${(1-tq)*80}px)`;
 $('mk').style.opacity=P(t,1.1,1.3);
 // ---- headline word by word (stamp-light)
 const hq=eOut(P(t,1.1,1.35));$('hl').style.opacity=hq;$('hl').style.transform=`translateY(${(1-hq)*40}px)`;
 ws.forEach((s,i)=>{const a=W0+i*WD,q=P(t,a-.02,a+.14);s.style.opacity=q>0?Math.pow(q,.5):0;s.style.transform=`translateY(${(1-eOut(q))*22}px)`});
 const ca=W0+ws.length*WD+.25,cq=P(t,ca,ca+.16);const chip=$('chip');chip.style.opacity=cq>0?1:0;chip.style.transform=`scale(${cq<1?1.4-.4*eback(cq):1}) rotate(${(1-cq)*-3}deg)`;chip.style.transformOrigin='100% 50%';
 // ---- ticker / brand bar
 const kq=eOut(P(t,1.4,1.7));$('tick').style.transform=`translateY(${(1-kq)*100}px)`;$('bar').style.transform=`translateY(${(1-kq)*100}px)`;
 $('run').style.right=(300-t*190)+'px';
 // ---- pulsing red frame for breaking
 const fc=$('frame').getContext('2d');fc.clearRect(0,0,1080,1920);
 if(CFG.breaking&&t>1.1){const w=7+5*Math.abs(Math.sin(t*3.2));fc.strokeStyle=CFG.color;fc.lineWidth=w*2;fc.strokeRect(0,0,1080,1920)}
 // ---- impacts
 const H=CFG.breaking?[[.24,.7],[.6,.8],[ca,.25]]:[[.24,.5],[.6,.4]];
 const sh=H.reduce((s,[a,k])=>s+(t>=a?k*16*Math.exp(-(t-a)*11):0),0);
 $('st').style.transform=`translate(${sh*nz(t*43)}px,${sh*nz(t*37)}px)`;
 $('flash').style.opacity=t>.6&&CFG.breaking?.35*Math.exp(-(t-.6)*12):0;
 const gs='grain'+(Math.floor(t*12)%4)+'.png';const gi=$('grain');if(gi.getAttribute('src')!==gs)gi.src=gs;await gi.decode().catch(()=>{});
};
</script></body></html>
