<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(a/fonts/Light.ttf);font-weight:300}
@font-face{font-family:B;src:url(a/fonts/Plain.ttf);font-weight:400}
@font-face{font-family:B;src:url(a/fonts/SemiBold.ttf);font-weight:600}
@font-face{font-family:B;src:url(a/fonts/Bold.ttf);font-weight:700}
@font-face{font-family:B;src:url(a/fonts/Black.ttf);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#01151c;font-family:B}
.abs{position:absolute}
#world,#scenes,.scene,.bgl,.fg,.gr,.scr{position:absolute;inset:0}
.scene{display:none;overflow:hidden}
.bgl>*{position:absolute}
.full{inset:0;width:100%;height:100%;object-fit:cover}
.deep{inset:0;background:radial-gradient(120% 90% at 72% 22%,#0c5a6c 0%,#04303d 48%,#011a22 100%)}
.deep.dark{background:radial-gradient(120% 90% at 70% 25%,#073f4d 0%,#022530 50%,#010f15 100%)}
.deep .tx{position:absolute;inset:-60px;background:url(a/tex_main.jpg) 0 0/640px;mix-blend-mode:overlay;opacity:.35}
.deep .bl{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(16px) saturate(.7);opacity:.38;mix-blend-mode:luminosity}
.gr{background:#0b6f82;mix-blend-mode:soft-light;opacity:.45;pointer-events:none}
.t{color:#fff;font-weight:700;text-shadow:0 4px 26px rgba(0,10,15,.6),0 1px 3px rgba(0,0,0,.45);line-height:1.28}
.beat{position:absolute;right:80px;width:920px;text-align:right}
.beat.fullb{inset:0;width:auto;right:0}
.ln{display:block;white-space:nowrap}
.lnm{overflow:hidden;padding:.06em .1em .14em}
.w{display:inline-block}
.bx{display:inline-block;background:url(a/tex_main.jpg) 0 0/640px;color:#fff;padding:.02em .24em .12em;text-shadow:none;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}
.cy{color:#61EDEE}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}
.chip{display:inline-block;color:#fff;font-weight:700;padding:6px 26px 12px;line-height:1.3;background:url(a/tex_main.jpg) 0 0/640px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.chip.tex2{background:url(a/tex_s1.jpg) 0 0/640px}
.bignum{position:absolute;font-size:820px;font-weight:900;line-height:.9;color:transparent;-webkit-text-stroke:3px rgba(97,237,238,.32);text-shadow:none}
.qmark{position:absolute;right:60px;top:90px;font-size:520px;font-weight:900;color:rgba(97,237,238,.16);line-height:1;text-shadow:none}
.tile{width:290px;height:250px;background:url(a/tex_main.jpg) 0 0/640px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;box-shadow:0 20px 40px -14px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:26px}
#fx{position:absolute;inset:0;z-index:20}#fx>*{position:absolute;inset:0;pointer-events:none}#brand{position:absolute;inset:0;z-index:30}
#flash{background:#fff;opacity:0}
#black{background:#000;opacity:0}
#leak{mix-blend-mode:screen;opacity:0}
#wipe>div{position:absolute;inset:0;transform:translateX(1100px)}
#grain{background-size:1080px 1350px;mix-blend-mode:overlay;opacity:.13}
#vig{background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(0,8,12,.55) 100%)}
#brand>*{position:absolute}
.cover3d{position:absolute;perspective:1600px}
.cover3d .bk{position:absolute;inset:0;transform-style:preserve-3d;box-shadow:0 40px 80px -20px rgba(0,0,0,.75)}
.cover3d img{width:100%;height:100%;display:block}
.cover3d .sp{position:absolute;top:0;bottom:0;left:0;width:22px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.2) 45%,rgba(0,0,0,.08))}
.cover3d .sw{position:absolute;inset:0;overflow:hidden}
.cover3d .sw i{position:absolute;top:-20%;bottom:-20%;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-14deg)}

function num(s){return s.replace(/\{([^}]+)\}/g,'<span class="num">$1</span>')}
function words(s){return s.trim().split(/\s+/).filter(Boolean).map(w=>`<span class="w">${num(w)}</span>`).join(' ')}
function md(line){
  return line.split(/(\*\*.+?\*\*|__.+?__)/).filter(x=>x!=='').map(seg=>{
    if(seg.startsWith('**'))return `<span class="bx">${words(seg.slice(2,-2))}</span>`;
    if(seg.startsWith('__'))return `<span class="cy">${words(seg.slice(2,-2))}</span>`;
    return words(seg)}).join(' ');
}

   ${p.targets.map(([k,l,t,h])=>`<path d="${arc(c[o],c[k],dv(h,60))}" fill="none" stroke="#61EDEE" stroke-width="4" stroke-dasharray="1" pathLength="1" data-draw="${t}" data-dur=".7"/>
     <circle cx="${c[k][0]}" cy="${c[k][1]}" r="11" fill="#fff" stroke="#0088A3" stroke-width="5" data-pop="${t+.6}"/>`).join('')}
   <circle cx="${c[o][0]}" cy="${c[o][1]}" r="9" fill="#61EDEE"/></svg>
   ${p.targets.map(([k,l,t,h,dx,dy])=>{const q=c[k];return `<div class="abs chip" data-pop="${t+.7}" style="left:${q[0]+dv(dx,10)}px;top:${q[1]+dv(dy,30)}px;font-size:34px;padding:2px 18px 8px">${l}</div>`}).join('')}`},
 // two columns split by a growing line: right {chip,text,t,tt}, left {chip,text,t,tt} (left text in cyan, bigger)
 split:p=>{const y=dv(p.y,500),R=p.right,L=p.left;return `<div class="abs" data-growv="${dv(p.lineT,R.t-.2)}" style="left:538px;top:${y}px;width:4px;height:${dv(p.h,420)}px;background:rgba(97,237,238,.6);transform-origin:top"></div>
   <div class="abs" style="right:80px;top:${y}px;width:420px">
     <div data-in="${R.t}"><span class="chip" style="font-size:46px">${R.chip}</span></div>
     <div class="t" data-in="${dv(R.tt,R.t+.4)}" style="font-size:48px;margin-top:26px;line-height:1.4">${R.text}</div></div>
   <div class="abs" style="left:80px;top:${y}px;width:420px;text-align:right">
     <div data-in="${L.t}"><span class="chip tex2" style="font-size:46px">${L.chip}</span></div>
     <div class="t cy" data-pop="${dv(L.tt,L.t+.2)}" style="font-size:72px;margin-top:26px;line-height:1.25">${L.text}</div></div>`},
 // grid of textured chips popping one by one: items [[text,t],...], cols
 chips:p=>`<div class="abs" style="right:80px;top:${dv(p.y,270)}px;width:920px;display:grid;grid-template-columns:repeat(${dv(p.cols,2)},1fr);gap:18px">${p.items.map(([x,t])=>`<div class="chip" data-pop="${t}" style="font-size:${dv(p.size,40)}px;text-align:center">${x}</div>`).join('')}</div>`,
 // huge counting number + unit + sub line: num, t (pop), t0..t1 (count), unit, sub ({2026} marks numbers)
 count:p=>`<div class="abs" data-pop="${p.t}" style="right:80px;top:${dv(p.y,560)}px;width:920px;text-align:right">
   <div class="t" style="font-size:${dv(p.size,210)}px;line-height:1"><span class="num" data-count="${p.num}" data-t0="${dv(p.t0,p.t+.1)}" data-t1="${dv(p.t1,p.t+1.1)}"${p.sep?' data-sep="1"':''}>${p.num}</span> <span style="font-size:72px">${p.unit||''}</span></div>
   ${p.sub?`<div class="t" style="font-size:40px;font-weight:600;margin-top:10px">${num(p.sub)}</div>`:''}</div>`,
 // framed photo card sliding in from the right: src (in a/ph), t, x,y,w,h
 card:p=>`<div class="abs" data-card="${dv(p.t,.15)}" style="left:${dv(p.x,110)}px;top:${dv(p.y,230)}px;width:${dv(p.w,860)}px;height:${dv(p.h,484)}px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);outline:3px solid rgba(97,237,238,.7);outline-offset:10px"><img src="a/ph/${p.src}" style="width:100%;height:100%;object-fit:cover"></div>`,
 // «A أو B» punch: a, or, b, t
 vs:p=>`<div class="abs row" style="right:80px;top:${dv(p.y,960)}px;gap:34px;align-items:baseline">
   <div class="t" data-pop="${p.t}" style="font-size:190px;font-weight:900;line-height:1">${p.a}</div>
   <div class="t" data-fade="${p.t+.35}" style="font-size:80px">${dv(p.or,'أو')}</div>
   <div class="t cy" data-pop="${p.t+.7}" style="font-size:190px;font-weight:900;line-height:1">${p.b}</div></div>`,
 // closing card: Center logo, ONE handle line, then the social icons (right-to-left order as listed)
 endcard:p=>{const t=dv(p.t,2.6);return `<img class="abs" data-pop="${t}" src="a/logo.png" style="left:455px;top:830px;width:170px;height:170px">
   <div class="abs" data-fade="${t+.5}" style="left:0;right:0;top:1028px;text-align:center;direction:ltr;font-size:38px;color:#fff;font-weight:400;letter-spacing:.5px">${dv(p.handle,'arabcenter.ar')}</div>
   <div class="abs" style="left:0;right:0;top:1110px;display:flex;justify-content:center;gap:26px;direction:rtl">${dv(p.icons,['facebook','x','youtube','threads','instagram','telegram']).map((n,k)=>`<div data-pop="${(t+.7+k*.12).toFixed(2)}" style="width:78px;height:78px;border-radius:50%;border:2px solid rgba(97,237,238,.6);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="${SOC[n]}"/></svg></div>`).join('')}</div>`}
};

window.__setup=async function(){
  let h='';
  S.forEach((s,i)=>{
    h+=`<div class="scene" id="s${i}"><div class="bgl">`;
    s.bg.forEach((b,j)=>{
      if(b.clip)h+=`<img class="full" data-b="${j}">`;
      else if(b.photo)h+=`<img data-b="${j}" src="a/ph/${b.photo}" style="height:1458px;top:-54px;left:0">`;
      else if(b.img)h+=`<img class="full" data-b="${j}" src="${b.img}">`;
      else h+=`<div class="deep${b.dark?' dark':''}" data-b="${j}">${b.blur?`<img class="bl" src="${fr(b.blur.clip,b.blur.f)}">`:''}<div class="tx"></div></div>`;
    });
    h+=`</div><div class="gr"></div><div class="scr"></div><div class="fg">`;
    s.beats.forEach((b,k)=>{
      if(b.blk){h+=`<div class="beat fullb" data-k="${k}">${BLK[b.blk.type](b.blk)}</div>`;return}
      if(b.html&&typeof CUSTOM!=='undefined'&&CUSTOM[b.html]){h+=`<div class="beat fullb" data-k="${k}">${CUSTOM[b.html]()}</div>`;return}
      const st=`top:${b.y}px;${b.x!=null?`right:${b.x}px;`:''}${b.w?`width:${b.w}px;`:''}${b.size?`font-size:${b.size}px;`:''}${b.weight?`font-weight:${b.weight};`:''}`;
      let inner=b.html?b.html:b.text.split('|').map(l=>b.anim==='mask'?`<div class="lnm"><div class="ln">${md(l)}</div></div>`:`<div class="ln">${md(l)}</div>`).join('');
      h+=`<div class="beat t" data-k="${k}" style="${st}">${inner}</div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById('scenes').innerHTML=h;
  S.forEach((s,i)=>{const sc=document.getElementById('s'+i);
    sc.querySelector('.scr').style.background= s.scrim==='top'?'linear-gradient(180deg,rgba(1,22,30,.86) 0%,rgba(1,22,30,.5) 34%,rgba(1,22,30,0) 58%)':
      s.scrim==='bottom'?'linear-gradient(0deg,rgba(1,22,30,.9) 0%,rgba(1,22,30,.5) 32%,rgba(1,22,30,0) 55%)':'none';
    if(s.bg.every(b=>b.deep))sc.querySelector('.gr').style.display='none';
  });
  document.getElementById('wipe').innerHTML=['tex_s1','tex_main','tex_s3'].map(x=>`<div style="background:url(a/${x}.jpg) 0 0/640px"></div>`).join('');
  document.getElementById('brand').innerHTML=`
    <div id="strip" style="right:0;top:380px;width:26px;height:340px;display:flex;flex-direction:column">${['s1','s2','s3','s4'].map(x=>`<div style="flex:1;background:url(a/tex_${x}.jpg) 0 0/400px"></div>`).join('')}</div>
    <div id="bstrip" style="left:114px;top:1326px;width:224px;height:24px;display:flex;direction:ltr">${['s2','s3','s4'].map(x=>`<div style="flex:1;background:url(a/tex_${x}.jpg) 0 0/400px"></div>`).join('')}</div>
    <img id="logo" src="a/logo.png" style="left:46px;top:1218px;width:94px;height:94px">`;
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  // photo widths
  document.querySelectorAll('img[data-b]').forEach(im=>{im.dataset.w=im.naturalWidth?Math.round(im.naturalWidth*1458/im.naturalHeight):1080});
};

// ---- transitions ----
function trIn(s,L){ // incoming transform for scene s at local L
  const t=s.tin; let tf='',f='',op=1;
  if(t==='zoom'&&L<.38){const p=eo(L/.38);tf=`scale(${1.2-.2*p})`;f=`blur(${(1-p)*12}px)`}
  if(t==='whip'&&L<.32){const p=eo(L/.32);tf=`translateX(${(1-p)*760}px)`;f=`blur(${(1-p)*16}px)`}
  if(t==='flash'&&L<.5){const p=eo(L/.5);tf=`scale(${1.07-.07*p})`}
  if(t==='leak'&&L<.1)op=eo((L+.45)/.55);
  return {tf,f,op};
}
function trOut(next,Lo){ // Lo = L-dur (<=0)
  if(!next)return {tf:'',f:''};
  if(next.tin==='zoom'&&Lo>-.3){const p=eio((Lo+.3)/.3);return {tf:`scale(${1+.28*p})`,f:`blur(${p*12}px)`}}
  if(next.tin==='whip'&&Lo>-.26){const p=eio((Lo+.26)/.26);return {tf:`translateX(${-p*760}px)`,f:`blur(${p*16}px)`}}
  return {tf:'',f:''};
}
function setA(n,op,tf,f){n.style.opacity=op;n.style.transform=tf||'';n.style.filter=f||''}

function animBeat(el,b,L,s){
  const a=b.anim, t0=b.t0, out=(b.t1<s.dur-.25)?eio((L-(b.t1-.35))/.35):0;
  const vis=L>=t0-.05&&L<b.t1;
  el.style.display=vis?'block':'none'; if(!vis)return false;
  el.style.opacity=1-out; el.style.filter=out>0?`blur(${out*6}px)`:'';
  let tf=out>0?`translateY(${-out*16}px)`:'';
  if(a==='words'||a==='type'){
    const ws=el.querySelectorAll('.w'); const st=a==='type'?.13:Math.min(.11,1.1/ws.length);
    ws.forEach((w,k)=>{const p=a==='type'?clamp((L-t0-k*st)/.08,0,1):eo((L-t0-k*st)/.45);
      w.style.opacity=p; if(a==='words'){w.style.transform=`translateY(${(1-p)*28}px)`;w.style.filter=p<1?`blur(${(1-p)*8}px)`:''}});
    el.querySelectorAll('.bx').forEach(bx=>{const k=[...ws].indexOf(bx.querySelector('.w'));const p=eio((L-t0-k*st+.05)/.35);bx.style.transform=`scaleX(${p})`;bx.style.transformOrigin='right'});
  }else if(a==='mask'){
    el.querySelectorAll('.ln').forEach((l,k)=>{const p=eo((L-t0-k*.13)/.6);l.style.transform=`translateY(${(1-p)*115}%)`});
  }else if(a==='stamp'){const p=clamp((L-t0)/.28,0,1),e=eo(p);el.style.opacity=(1-out)*Math.min(1,p*2.5);tf+=` scale(${1.9-.9*e}) rotate(${b.rot||0}deg)`;el.style.transformOrigin='right center'}
  else if(a==='pop'){const p=eback((L-t0)/.45);el.style.opacity=(1-out)*clamp((L-t0)/.2,0,1);tf+=` scale(${.6+.4*p})`;el.style.transformOrigin='right center'}
  else if(a==='slide'){const p=eo((L-t0)/.55);el.style.opacity=(1-out)*p;tf+=` translateX(${(1-p)*80}px)`}
  else if(a==='fade'){el.style.opacity=(1-out)*eo((L-t0)/.7)}
  el.style.transform=tf;
  // nested data animations (scene-local times, shifted with their beat)
  const Lx=L-(b.sh||0);
  el.querySelectorAll('[data-pop]').forEach(n=>{const t=+n.dataset.pop,p=eback((Lx-t)/.45);n.style.opacity=clamp((Lx-t)/.18,0,1);n.style.transform=`scale(${clamp(.55+.45*p,0,1.2)})`;n.style.transformOrigin='center'});
  el.querySelectorAll('[data-in]').forEach(n=>{const p=eo((Lx-(+n.dataset.in))/.55);n.style.opacity=p;n.style.transform=`translateX(${(1-p)*70}px)`});
  el.querySelectorAll('[data-fade]').forEach(n=>{n.style.opacity=eo((Lx-(+n.dataset.fade))/.6)});
  el.querySelectorAll('[data-grow]').forEach(n=>{n.style.transform=`scaleX(${eio((Lx-(+n.dataset.grow))/(+n.dataset.dur||.8))})`});
  el.querySelectorAll('[data-growv]').forEach(n=>{n.style.transform=`scaleY(${eio((Lx-(+n.dataset.growv))/.7)})`});
  el.querySelectorAll('[data-draw]').forEach(n=>{const p=eio((Lx-(+n.dataset.draw))/(+n.dataset.dur||.6));n.style.strokeDasharray='1 1';n.style.strokeDashoffset=1-p;n.style.opacity=p>0?1:0});
  el.querySelectorAll('[data-count]').forEach(n=>{const p=eio((Lx-(+n.dataset.t0))/((+n.dataset.t1)-(+n.dataset.t0))),v=(+n.dataset.count)*p,d=+(n.dataset.dec||0);
    n.textContent=d?v.toFixed(d):(n.dataset.sep?Math.round(v).toLocaleString('en-US'):String(Math.round(v)))});
  el.querySelectorAll('[data-hl]').forEach(n=>{const [a1,b1]=n.dataset.hl.split(',').map(Number);const on=Lx>=a1&&Lx<b1;n.style.color=on?'#61EDEE':'#fff';n.style.opacity=(Lx>=b1&&b1<99)?.78:1});
  el.querySelectorAll('[data-cover]').forEach(n=>{const t=+n.dataset.cover,p=eo((Lx-t)/.9),bk=n.querySelector('.bk');
    const r0=+n.dataset.r; bk.style.transform=`translateX(${(1-p)*260}px) rotateY(${lerp(r0>0?70:-70,r0,p)+ (Lx-t)*1.2*(r0>0?-1:1)}deg)`; n.style.opacity=clamp((Lx-t)/.3,0,1);
    const sw=n.querySelector('.sw i'), q=clamp((Lx-t-1.2)/1.1,0,1); sw.style.left=`${-50+q*160}%`; sw.style.opacity=q>0&&q<1?1:0});
  el.querySelectorAll('[data-card]').forEach(n=>{const t=+n.dataset.card,p=eo((Lx-t)/.6);n.style.opacity=p;n.style.transform=`translateX(${(1-p)*300}px) rotate(${-2.2+(1-p)*-4}deg) scale(${1+.04*clamp((Lx-t)/4,0,1)})`});
  return true;
}

window.__renderAt=async function(t){
  const pend=[];
  S.forEach((s,i)=>{
    const sc=document.getElementById('s'+i), L=t-s.start, next=S[i+1];
    const pre=s.tin==='leak'?.45:0;
    if(L<-pre||L>=s.dur){sc.style.display='none';return}
    sc.style.display='block'; sc.style.zIndex=L<0?2:1;
    const ti=trIn(s,L), to=trOut(next,L-s.dur);
    setA(sc,ti.op,[ti.tf,to.tf].join(' '),[ti.f,to.f].join(' ').trim());
    // background
    s.bg.forEach((b,j)=>{
      const n=sc.querySelector(`[data-b="${j}"]`), from=b.from||0, nb=s.bg[j+1], end=nb?(nb.from+.35):s.dur+1;
      const vis=L>=from-.01&&L<end; n.style.display=vis?'block':'none'; if(!vis)return;
      const fade= j===0?1:eo((L-from)/.35); n.style.opacity=fade;
      const span=(nb?nb.from:s.dur)-from, p=clamp((L-from)/span,0,1);
      const z=b.z?lerp(b.z[0],b.z[1],p):1;
      if(b.clip){const f=Math.floor((Math.max(0,L-from))*FPS*(b.rate||1))+1;const src=fr(b.clip,f);if(n.getAttribute('src')!==src){n.setAttribute('src',src);pend.push(n.decode().catch(()=>{}))}
        let fl=''; if(b.gray){const g=clamp((L-b.gray[0])/(b.gray[1]-b.gray[0]),0,1);fl=`grayscale(${g*.92}) brightness(${1-g*.15})`}
        if(b.dark)fl+=` brightness(${1-b.dark})`; n.style.filter=fl; n.style.transform=`scale(${z})`}
      else if(b.photo){const w=+n.dataset.w, pan=lerp(b.pan[0],b.pan[1],eio(p)); n.style.left=`${-pan*(w-1080)}px`; n.style.transform=`scale(${z})`; n.style.transformOrigin=`${540+pan*(w-1080)}px 729px`}
      else if(b.img){n.style.transform=`scale(${z})`}
      else {const tx=n.querySelector('.tx'); tx.style.transform=`translate(${-L*6}px,${L*3}px)`; const bl=n.querySelector('.bl'); if(bl)bl.style.transform=`scale(${1.05+L*.006})`}
    });
    // beats
    const fg=sc.querySelector('.fg');
    s.beats.forEach((b,k)=>animBeat(fg.querySelector(`[data-k="${k}"]`),b,L,s));
    // glitch
    let gl=0;(s.glitch||[]).forEach(g=>{if(L>=g.t&&L<g.t+g.d)gl=1});
    fg.style.filter=gl?`drop-shadow(6px 0 0 rgba(255,40,90,.75)) drop-shadow(-6px 0 0 rgba(0,240,255,.75))`:'';
    fg.style.transform=gl?`translateX(${(rnd(Math.floor(t*60))-.5)*24}px)`:'';
  });
  // global fx
  let fl=0, bk=0, lk=0, lkx=0, wipe=null, sh=0, shx=0, shy=0;
  S.forEach((s,i)=>{const B=s.start;
    if(s.tin==='zoom'){if(t>B-.3&&t<B)fl=Math.max(fl,eio((t-B+.3)/.3)*.85);if(t>=B&&t<B+.4)fl=Math.max(fl,.85*(1-eo((t-B)/.4)))}
    if(s.tin==='flash'){if(t>B-.05&&t<B)fl=Math.max(fl,(t-B+.05)/.05);if(t>=B&&t<B+.35)fl=Math.max(fl,1-eo((t-B)/.35))}
    if(s.tin==='whip'&&t>B-.12&&t<B+.18)fl=Math.max(fl,.22);
    if(s.tin==='black'&&t<B+.7)bk=1-eo((t-B)/.7);
    if(s.tin==='wipe'&&t>B-.45&&t<B+.5)wipe={B};
    const lks=(s.leak||[]).map(l=>({t:B+l.t,d:l.d}));if(s.tin==='leak')lks.push({t:B-.45,d:1.5});
    lks.forEach(l=>{if(t>l.t&&t<l.t+l.d){const p=(t-l.t)/l.d;lk=Math.max(lk,Math.sin(Math.PI*p));lkx=p}});
    (s.shake||[]).forEach(e=>{const a=B+e.t;if(t>=a&&t<a+e.d){const p=1-(t-a)/e.d;const f=Math.floor(t*60);shx+=(rnd(f)-.5)*2*e.a*p;shy+=(rnd(f+7)-.5)*2*e.a*p}});
  });
  if(t>TOTAL-.6)bk=Math.max(bk,eio((t-TOTAL+.6)/.6)*0);
  document.getElementById('flash').style.opacity=fl;
  document.getElementById('black').style.opacity=bk; document.getElementById('brand').style.opacity=1-bk;
  const lkEl=document.getElementById('leak'); lkEl.style.opacity=lk*.85;
  lkEl.style.background=`radial-gradient(60% 45% at ${110-lkx*130}% 35%,rgba(97,237,238,.75),rgba(0,136,163,.35) 40%,transparent 70%),radial-gradient(40% 30% at ${130-lkx*160}% 70%,rgba(255,214,160,.35),transparent 70%)`;
  const wb=document.getElementById('wipe').children;
  [...wb].forEach((d,k)=>{if(!wipe){d.style.transform='translateX(1100px)';return}
    const B=wipe.B, a=B-.45+k*.06, inP=eio((t-a)/.38), outP=eio((t-B-k*.05)/.4);
    d.style.transform=`translateX(${t<B?(1-inP)*1100:-outP*1100}px)`});
  document.getElementById('world').style.transform=(shx||shy)?`translate(${shx}px,${shy}px)`:'';
  const g=document.getElementById('grain'); g.style.backgroundImage=`url(a/grain${Math.floor(t*12)%6}.png)`;
  // brand: hide small logo in outro
  const last=S[S.length-1], lo=clamp((t-last.start-1.6)/.6,0,1);
  document.getElementById('logo').style.opacity=1-lo;
  await Promise.all(pend);
};
window.__TOTAL=TOTAL;
